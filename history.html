<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football AI Pro — İstatistik & Geçmiş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main">
    <div class="page-header">
      <h1>İstatistik & Geçmiş</h1>
      <div class="sub">Gerçek sonuçları kendin işaretledikçe bu sayfa dolar — sistem maç sonuçlarını otomatik öğrenemez.</div>
    </div>

    <div id="statsZone"></div>

    <div class="panel">
      <h2>Sonuç Gir</h2>
      <p class="hint">Bir günü seç, o günkü bacakların gerçekte tutup tutmadığını işaretle, kaydet. Bu, İstatistik bölümündeki başarı/ROI hesaplamasını besler.</p>
      <div class="field">
        <label>Rapor Tarihi</label>
        <select id="reportPicker" onchange="renderLegLogger()"></select>
      </div>
      <div id="legLogger"></div>
    </div>

    <div class="panel">
      <h2>Geçmiş Raporlar</h2>
      <div id="reportsList"></div>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/poisson.js"></script>
<script src="js/edge.js"></script>
<script src="js/statistics.js"></script>
<script src="js/app.js"></script>
<script>
initShell('history');

function renderStats(){
  const s = computeStatistics();
  const el = document.getElementById('statsZone');
  if(s.total===0){
    el.innerHTML = `<div class="panel"><p class="empty-note">Henüz hiç sonuç girilmedi. Aşağıdan bir günün bacaklarını işaretleyerek başla.</p></div>`;
    return;
  }
  el.innerHTML = `<div class="stat-row">
    <div class="stat"><div class="lbl">Toplam Tahmin</div><div class="num num-gold">${s.total}</div></div>
    <div class="stat"><div class="lbl">Doğru</div><div class="num num-growth">${s.correct}</div></div>
    <div class="stat"><div class="lbl">Yanlış</div><div class="num num-risk">${s.wrong}</div></div>
    <div class="stat"><div class="lbl">Başarı</div><div class="num num-gold">${(s.successRate*100).toFixed(0)}%</div></div>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="lbl">ROI</div><div class="num ${s.roi>=0?'num-growth':'num-risk'}">${s.roi>=0?'+':''}${(s.roi*100).toFixed(0)}%</div></div>
    <div class="stat"><div class="lbl">En Başarılı Market</div><div class="num num-growth" style="font-size:14px;">${s.bestMarket?`${s.bestMarket.market} (${(s.bestMarket.rate*100).toFixed(0)}%)`:'—'}</div></div>
    <div class="stat"><div class="lbl">En Kötü Market</div><div class="num num-risk" style="font-size:14px;">${s.worstMarket?`${s.worstMarket.market} (${(s.worstMarket.rate*100).toFixed(0)}%)`:'—'}</div></div>
    <div class="stat"><div class="lbl">Net Kâr (birim stake)</div><div class="num ${s.netProfit>=0?'num-growth':'num-risk'}">${s.netProfit>=0?'+':''}${s.netProfit.toFixed(2)}</div></div>
  </div>`;
}

function getReportDates(){
  const reports = getReports();
  return Object.keys(reports).sort().reverse();
}

function renderReportPicker(){
  const dates = getReportDates();
  const sel = document.getElementById('reportPicker');
  if(dates.length===0){
    sel.innerHTML = '<option value="">Henüz rapor yok</option>';
    return;
  }
  sel.innerHTML = dates.map(d=>`<option value="${d}">${d}</option>`).join('');
  renderLegLogger();
}

function renderLegLogger(){
  const dateKey = document.getElementById('reportPicker').value;
  const reports = getReports();
  const report = reports[dateKey];
  const el = document.getElementById('legLogger');
  if(!report || !report.legs || report.legs.length===0){
    el.innerHTML = '<p class="empty-note">Bu rapor için bacak verisi yok.</p>';
    return;
  }
  let html = `<div class="table-scroll"><table>
    <thead><tr><th>Maç</th><th>Pazar</th><th>Oran</th><th>Sonuç</th></tr></thead><tbody>`;
  report.legs.forEach((l,i)=>{
    html += `<tr>
      <td>${l.mac}</td><td>${l.pazar}</td><td>${l.odds}</td>
      <td>
        <select id="res_${i}">
          <option value="">—</option>
          <option value="dogru">Doğru çıktı</option>
          <option value="yanlis">Yanlış çıktı</option>
        </select>
      </td>
    </tr>`;
  });
  html += `</tbody></table></div>
  <div class="btn-row" style="margin-top:12px;">
    <button class="primary" onclick="saveLoggedResults('${dateKey}')">Sonuçları Kaydet</button>
    <span class="save-note" id="logSaveNote"></span>
  </div>`;
  el.innerHTML = html;
}

function saveLoggedResults(dateKey){
  const reports = getReports();
  const report = reports[dateKey];
  let count = 0;
  report.legs.forEach((l,i)=>{
    const val = document.getElementById(`res_${i}`).value;
    if(val){
      addLoggedResult({ tarih: dateKey, mac: l.mac, pazar: l.pazar, oran: l.odds, sonuc: val, stake: 1 });
      count++;
    }
  });
  document.getElementById('logSaveNote').textContent = `${count} sonuç kaydedildi ✓`;
  renderStats();
}

function renderReportsList(){
  const dates = getReportDates();
  const el = document.getElementById('reportsList');
  if(dates.length===0){
    el.innerHTML = '<p class="empty-note">Henüz kaydedilmiş rapor yok.</p>';
    return;
  }
  const reports = getReports();
  let html = '';
  dates.forEach(d=>{
    const r = reports[d];
    html += `<div class="coupon-card">
      <div class="head"><h3>${d}</h3>
      <button class="ghost" onclick="toggleReportDetail('${d}')">Aç</button></div>
      <div class="meta-row">
        <span>Analiz: ${r.stats.analyzed}</span>
        <span>Oynanabilir: ${r.stats.playable}</span>
        <span>Value: ${r.stats.value}</span>
        <span>Kupon: ${r.coupons ? r.coupons.length : 0}</span>
      </div>
      <div id="detail_${d}" style="display:none;margin-top:10px;"></div>
    </div>`;
  });
  el.innerHTML = html;
}

function toggleReportDetail(dateKey){
  const box = document.getElementById(`detail_${dateKey}`);
  if(box.style.display==='block'){ box.style.display='none'; return; }
  const reports = getReports();
  const r = reports[dateKey];
  if(!r.coupons || r.coupons.length===0){
    box.innerHTML = '<p class="empty-note">O gün kupon önerisi yok.</p>';
  } else {
    box.innerHTML = r.coupons.map((c,i)=>`
      <div class="leg-line"><b>Kupon ${i+1}</b> (${starString(c.stars)}) — Toplam Oran: ${c.totalOdds}<br>
      ${c.legs.map(l=>`${l.mac} → ${l.pazar} @ ${l.odds}`).join('<br>')}</div>
    `).join('');
  }
  box.style.display = 'block';
}

renderStats();
renderReportPicker();
renderReportsList();
</script>
</body>
</html>
