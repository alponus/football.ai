<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football AI Pro — Kuponlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main">
    <div class="page-header">
      <h1>Kuponlar</h1>
      <div class="sub" id="dateLabel"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/poisson.js"></script>
<script src="js/edge.js"></script>
<script src="js/scoring.js"></script>
<script src="js/insights.js"></script>
<script src="js/coupons.js"></script>
<script src="js/app.js"></script>
<script>
initShell('coupons');
const analysis = getLastAnalysis();
document.getElementById('dateLabel').textContent = analysis ? `Son analiz: ${analysis.date}` : 'Henüz analiz yapılmadı';

function gercekciBasariOrani(coupon){
  // Naif carpim iyimser cikar - bacaklar arasi kucuk korelasyonlari
  // hesaba katan muhafazakar bir gorunum icin %85 ile carpiyoruz.
  return Math.max(0, coupon.basariTahmini * 0.85);
}

const el = document.getElementById('content');
if(!analysis){
  el.innerHTML = `<div class="panel"><p class="empty-note">Henüz bir analiz yapılmadı. Dashboard sayfasından maç verisi girip "Analiz Et" butonuna bas.</p></div>`;
} else if(analysis.coupons.length===0){
  el.innerHTML = `<div class="panel"><div class="no-play-banner">BUGÜN OYNAMA</div>
    <p class="empty-note" style="margin-top:10px;">Son analizde hedef oran aralığına ulaşan, pozitif edge taşıyan bir kombinasyon bulunamadı.</p></div>`;
} else {
  let html = '<div class="panel"><h2>Önerilen Kuponlar</h2><p class="hint">Her kuponun altında, o kuponun neden bu şekilde kurulduğunu ve gerçekçi tutma ihtimalini görebilirsin — Dashboard\'daki maç yorumlarıyla aynı mantığı kullanır.</p>';
  analysis.coupons.forEach((c,i)=>{
    const ortalamaGuven = c.legs.reduce((s,l)=>s+l.guvenScore,0)/c.legs.length;
    const verdict = getVerdict(ortalamaGuven, c.avgEdge);
    const gercekci = gercekciBasariOrani(c);
    html += `<div class="coupon-card"><div class="head">
      <h3>${c.tip} Kupon <span class="stars">${starString(c.stars)}</span></h3>
      <span class="tag" style="color:var(--${verdict.renk})">${verdict.etiket}</span>
    </div>`;
    c.legs.forEach(l=>{
      html += `<div class="leg-line">${l.mac} → <b>${l.pazar}</b> @ ${l.odds} <span style="color:var(--muted);float:right;">avantaj +${(l.edge*100).toFixed(1)}%</span></div>`;
    });
    html += `<div class="meta-row">
      <span>Gerçekçi Tutma İhtimali: ${(gercekci*100).toFixed(0)}%</span>
      <span>Toplam Oran: ${c.totalOdds}</span>
      <span>Ort. Avantaj: ${(c.avgEdge*100).toFixed(1)}%</span>
    </div>
    ${c.not ? `<p style="font-size:11.5px;color:var(--gold);margin-top:8px;">⚠ ${c.not}</p>` : ''}
    <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);">
      <b style="color:var(--text);">Neden bu kupon?</b> ${generateCouponExplanation(c, c.tip)}
    </div></div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}
</script>
</body>
</html>
