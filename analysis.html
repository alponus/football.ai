<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football AI Pro — Maç Analizi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main">
    <div class="page-header">
      <h1>Maç Analizi</h1>
      <div class="sub" id="dateLabel"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/poisson.js"></script>
<script src="js/edge.js"></script>
<script src="js/statistics.js"></script>
<script src="js/app.js"></script>
<script>
initShell('analysis');
const analysis = getLastAnalysis();
document.getElementById('dateLabel').textContent = analysis ? `Son analiz: ${analysis.date}` : 'Henüz analiz yapılmadı';

const el = document.getElementById('content');

if(!analysis){
  el.innerHTML = `<div class="panel"><p class="empty-note">Henüz bir analiz yapılmadı. Dashboard sayfasından maç verisi girip "Analiz Et" butonuna bas.</p></div>`;
} else {
  renderPage();
}

function formStr(form){
  if(!form) return '<span style="color:var(--muted)">veri yok</span>';
  const colored = form.split('').map(c=>{
    const cls = c==='W'?'w':(c==='L'?'l':'d');
    return `<span class="${cls}">${c}</span>`;
  }).join('');
  return `<span class="form-string">${colored}</span>`;
}

function renderPage(){
  const ligler = [...new Set(analysis.legs.map(l=>l.lig).filter(Boolean))].sort();
  const marketler = [...new Set(analysis.legs.map(l=>l.pazar))].sort();

  let html = `<div class="panel">
    <h2>Filtreler</h2>
    <p class="hint">Tüm filtreler aynı anda birlikte çalışır. Sadece "Tüm Bacaklar" tablosunu etkiler.</p>
    <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="field">
        <label>Lig</label>
        <select id="f_lig"><option value="">Tümü</option>${ligler.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Bahis Marketi</label>
        <select id="f_market"><option value="">Tümü</option>${marketler.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Risk Seviyesi</label>
        <select id="f_risk"><option value="">Tümü</option><option>Düşük</option><option>Orta</option><option>Yüksek</option><option>Belirsiz</option></select>
      </div>
    </div>
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr);">
      <div class="field"><label>Min. Oran <span id="v_fOdds"></span></label><input type="range" id="f_minOdds" min="1" max="20" step="0.1" value="1"></div>
      <div class="field"><label>Min. Güven Puanı <span id="v_fGuven"></span></label><input type="range" id="f_minGuven" min="0" max="100" step="5" value="0"></div>
      <div class="field"><label>Min. Edge (%) <span id="v_fEdge"></span></label><input type="range" id="f_minEdge" min="-50" max="50" step="1" value="-50"></div>
      <div class="field" style="display:flex;align-items:flex-end;">
        <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="f_hideWeak" style="width:15px;height:15px;"> Gerçek başarı oranı %30 altındaki marketleri gizle</label>
      </div>
    </div>
    <div class="btn-row"><button class="ghost" onclick="temizleFiltreler()">Filtreleri Temizle</button><span class="save-note" id="filterCount"></span></div>
  </div>`;

  html += `<div class="panel"><h2>Maç Bazlı Detay</h2><div class="table-scroll"><table>
    <thead><tr><th>Maç</th><th>Ev Form</th><th>Dep Form</th><th>Ev Gol Ort.</th><th>Dep Gol Ort.</th><th>Poisson λ</th><th>Tahmini Skor</th><th>Güven</th></tr></thead><tbody>`;
  analysis.projections.forEach(p=>{
    html += `<tr>
      <td>${p.evTakim} - ${p.depTakim}</td>
      <td>${formStr(p.evForm)}</td><td>${formStr(p.depForm)}</td>
      <td>${p.evGolOrt!==null?p.evGolOrt.toFixed(2):'—'}</td>
      <td>${p.depGolOrt!==null?p.depGolOrt.toFixed(2):'—'}</td>
      <td>${p.lambdaTotal}</td><td>${p.tahminiSkor}</td><td class="tag">${p.guven}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;

  html += `<div class="panel"><h2>Tüm Bacaklar (Model vs Oran)</h2><div class="table-scroll" id="legTableZone"></div></div>`;

  el.innerHTML = html;

  ['f_lig','f_market','f_risk','f_hideWeak'].forEach(id=>document.getElementById(id).addEventListener('change', uygulaFiltreler));
  ['f_minOdds','f_minGuven','f_minEdge'].forEach(id=>document.getElementById(id).addEventListener('input', ()=>{ updateFilterLabels(); uygulaFiltreler(); }));
  updateFilterLabels();
  uygulaFiltreler();
}

function updateFilterLabels(){
  document.getElementById('v_fOdds').textContent = document.getElementById('f_minOdds').value;
  document.getElementById('v_fGuven').textContent = document.getElementById('f_minGuven').value;
  document.getElementById('v_fEdge').textContent = document.getElementById('f_minEdge').value + '%';
}

function temizleFiltreler(){
  document.getElementById('f_lig').value = '';
  document.getElementById('f_market').value = '';
  document.getElementById('f_risk').value = '';
  document.getElementById('f_hideWeak').checked = false;
  document.getElementById('f_minOdds').value = 1;
  document.getElementById('f_minGuven').value = 0;
  document.getElementById('f_minEdge').value = -50;
  updateFilterLabels();
  uygulaFiltreler();
}

function uygulaFiltreler(){
  const lig = document.getElementById('f_lig').value;
  const market = document.getElementById('f_market').value;
  const risk = document.getElementById('f_risk').value;
  const minOdds = parseFloat(document.getElementById('f_minOdds').value);
  const minGuven = parseFloat(document.getElementById('f_minGuven').value);
  const minEdge = parseFloat(document.getElementById('f_minEdge').value)/100;
  const hideWeak = document.getElementById('f_hideWeak').checked;

  let zayifMarketler = new Set();
  if(hideWeak){
    const marketRates = computeStatistics().marketRates || [];
    marketRates.forEach(m=>{ if(m.rate < 0.30) zayifMarketler.add(m.market); });
  }

  const filtreli = analysis.legs.filter(l=>
    (!lig || l.lig===lig) &&
    (!market || l.pazar===market) &&
    (!risk || l.risk===risk) &&
    l.odds >= minOdds &&
    l.guvenScore >= minGuven &&
    l.edge >= minEdge &&
    !(hideWeak && zayifMarketler.has(l.pazar))
  );

  document.getElementById('filterCount').textContent = `${filtreli.length} / ${analysis.legs.length} bacak gösteriliyor`;

  let html = `<table><thead><tr><th>Maç</th><th>Lig</th><th>Pazar</th><th>Model</th><th>Oran</th><th>İma Edilen</th><th>Edge</th><th>EV</th><th>Risk</th><th>Yıldız</th></tr></thead><tbody>`;
  [...filtreli].sort((a,b)=>b.edge-a.edge).forEach(l=>{
    html += `<tr>
      <td>${l.mac}</td><td>${l.lig||'—'}</td><td>${l.pazar}</td><td>${(l.modelProb*100).toFixed(1)}%</td><td>${l.odds}</td>
      <td>${(l.implied*100).toFixed(1)}%</td>
      <td class="${l.edge>=0?'edge-pos':'edge-neg'}">${(l.edge*100).toFixed(1)}%</td>
      <td class="${l.ev>=0?'edge-pos':'edge-neg'}">${l.ev>=0?'+':''}${(l.ev*100).toFixed(1)}%</td>
      <td>${l.risk}</td><td class="stars">${starString(l.stars)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  if(filtreli.length===0){
    html = `<p class="empty-note">Bu filtrelere uyan bacak yok. "Filtreleri Temizle" ile baştan başlayabilirsin.</p>`;
  }
  document.getElementById('legTableZone').innerHTML = html;
}
</script>
</body>
</html>
